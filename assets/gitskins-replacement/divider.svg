
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="36"
     viewBox="0 0 900 36">

  <defs>
    <linearGradient id="dividerGradient"
      gradientUnits="userSpaceOnUse"
      x1="12" y1="18" x2="888" y2="18">
      <stop offset="0%" stop-color="#174CBB"/>
      <stop offset="100%" stop-color="#E21D36"/>
    </linearGradient>

    <filter id="dividerGlow"
      x="-300%" y="-300%"
      width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Gradient line -->
  <line x1="12" y1="18" x2="888" y2="18"
    stroke="url(#dividerGradient)"
    stroke-width="2"/>

  <!-- Left blue keyframe -->
  <path d="M12 10 L20 18 L12 26 L4 18 Z"
    fill="#174CBB"/>

  <!-- Right red keyframe -->
  <path d="M888 10 L896 18 L888 26 L880 18 Z"
    fill="#E21D36"/>

  <!-- Moving light glow -->
  <circle r="5" fill="url(#dividerGradient)"
    opacity=".45" filter="url(#dividerGlow)">
    <animateMotion
      dur="3.5s"
      repeatCount="indefinite"
      path="M12 18 L888 18"/>
  </circle>

  <!-- Moving gradient-colored dot -->
  <circle r="5" fill="url(#dividerGradient)">
    <animateMotion
      dur="3.5s"
      repeatCount="indefinite"
      path="M12 18 L888 18"/>
  </circle>

</svg>
