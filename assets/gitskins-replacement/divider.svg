

<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="36"
     viewBox="0 0 900 36">

  <defs>
    <linearGradient id="dividerGradient"
      gradientUnits="userSpaceOnUse"
      x1="12" y1="18" x2="888" y2="18">
      <stop offset="0%" stop-color="#174CBB"/>
      <stop offset="100%" stop-color="#E21D36"/>
    </linearGradient>
  </defs>

  <!-- Gradient line -->
  <line x1="12" y1="18" x2="888" y2="18"
    stroke="url(#dividerGradient)"
    stroke-width="2"/>

  <!-- Left blue keyframe -->
  <path d="M12 10 L20 18 L12 26 L4 18 Z"
    fill="#174CBB"/>

  <!-- Right red keyframe -->
  <path d="M888 10 L896 18 L888 26 L880 18 Z"
    fill="#E21D36"/>

  <!-- Moving light glow -->
  <circle r="12" fill="#174CBB" opacity=".08">
    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      path="M12 18 L888 18 L12 18"/>
    <animate
      attributeName="fill"
      values="#174CBB;#E21D36;#174CBB"
      keyTimes="0;0.5;1"
      calcMode="linear"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <circle r="8" fill="#174CBB" opacity=".16">
    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      path="M12 18 L888 18 L12 18"/>
    <animate
      attributeName="fill"
      values="#174CBB;#E21D36;#174CBB"
      keyTimes="0;0.5;1"
      calcMode="linear"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Moving gradient-colored dot -->
  <circle r="5" fill="#174CBB">
    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      path="M12 18 L888 18 L12 18"/>
    <animate
      attributeName="fill"
      values="#174CBB;#E21D36;#174CBB"
      keyTimes="0;0.5;1"
      calcMode="linear"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

</svg>
