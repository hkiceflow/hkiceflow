<svg xmlns="http://www.w3.org/2000/svg"
    width="900" height="190" viewBox="0 0 900 190">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10182d"/>
        <stop offset="100%" stop-color="#17112b"/>
      </linearGradient>

      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#62a8ff"/>
        <stop offset="55%" stop-color="#9b7bff"/>
        <stop offset="100%" stop-color="#e18bff"/>
      </linearGradient>

      <linearGradient id="rgbBorder"
        x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#FF0000"/>
        <stop offset="33%" stop-color="#00FF00"/>
        <stop offset="67%" stop-color="#0000FF"/>
        <stop offset="100%" stop-color="#FF0000"/>

        <animateTransform
          attributeName="gradientTransform"
          type="rotate"
          from="0 0.5 0.5"
          to="360 0.5 0.5"
          dur="12s"
          repeatCount="indefinite"/>
      </linearGradient>
    </defs>

    <rect width="100%" height="100%" rx="18" fill="url(#bg)"
      stroke="#34415f" stroke-width="1"/>

    <circle cx="870" cy="10" r="100"
      fill="#765cff" opacity=".07"/>

    <text x="28" y="39" fill="#f0f3ff" font-size="20"
      font-family="Segoe UI,Arial" font-weight="600">GitHub Overview</text>

    <text x="28" y="61" fill="#8998b8" font-size="11"
      font-family="Segoe UI,Arial" letter-spacing="2">PROFILE STATISTICS</text>

    <rect x="28" y="76" width="54" height="3" rx="2"
      fill="url(#accent)"/>
    
    <defs>
      <radialGradient id="planetBlue">
        <stop offset="0%" stop-color="#d8f7ff"/>
        <stop offset="35%" stop-color="#62caff"/>
        <stop offset="75%" stop-color="#2585e8"/>
        <stop offset="100%" stop-color="#1550a8"/>
      </radialGradient>

      <filter id="planetGlow" x="-300%" y="-300%"
        width="700%" height="700%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Diagonal galaxy orbit -->
    <ellipse cx="790" cy="60" rx="85" ry="20"
      transform="rotate(-35 790 60)"
      fill="none"
      stroke="#557bbd"
      stroke-width="1.2"
      opacity=".38"/>

    <ellipse cx="790" cy="60" rx="85" ry="20"
      transform="rotate(-35 790 60)"
      fill="none"
      stroke="#79caff"
      stroke-width="1.5"
      stroke-dasharray="28 190"
      opacity=".65"/>

    <!-- Blue planet glow -->
    <circle r="8" fill="#319dff" opacity=".35"
      filter="url(#planetGlow)">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M 859.6,11.3 A 85,20 -35 1,1 720.4,108.7 A 85,20 -35 1,1 859.6,11.3"/>
    </circle>

    <!-- Moving blue planet -->
    <circle r="5.5" fill="url(#planetBlue)"
      stroke="#a8e8ff" stroke-width=".8"
      filter="url(#planetGlow)">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M 859.6,11.3 A 85,20 -35 1,1 720.4,108.7 A 85,20 -35 1,1 859.6,11.3"/>
    </circle>

    <!-- Planet highlight -->
    <circle r="1.5" fill="#ffffff" opacity=".9">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M 859.6,11.3 A 85,20 -35 1,1 720.4,108.7 A 85,20 -35 1,1 859.6,11.3"/>
    </circle>

    <text x="28" y="125" fill="#8d9ab8" font-size="11"
      font-family="Segoe UI,Arial">REPOSITORIES</text>

    <g opacity="0">
      <animate attributeName="opacity"
        from="0" to="1"
        begin="0.00s"
        dur="1.30s"
        fill="freeze"/>
      <animateTransform attributeName="transform"
        type="translate"
        from="0 10" to="0 0"
        begin="0.00s"
        dur="1.30s"
        fill="freeze"/>
      <text x="28" y="160" fill="#f3f5ff" font-size="27"
        font-family="Segoe UI,Arial" font-weight="600">4</text>
    </g>
    
    <text x="246" y="125" fill="#8d9ab8" font-size="11"
      font-family="Segoe UI,Arial">STARS</text>

    <g opacity="0">
      <animate attributeName="opacity"
        from="0" to="1"
        begin="0.44s"
        dur="1.30s"
        fill="freeze"/>
      <animateTransform attributeName="transform"
        type="translate"
        from="0 10" to="0 0"
        begin="0.44s"
        dur="1.30s"
        fill="freeze"/>
      <text x="246" y="160" fill="#f3f5ff" font-size="27"
        font-family="Segoe UI,Arial" font-weight="600">54</text>
    </g>
    
    <text x="464" y="125" fill="#8d9ab8" font-size="11"
      font-family="Segoe UI,Arial">CONTRIBUTIONS</text>

    <g opacity="0">
      <animate attributeName="opacity"
        from="0" to="1"
        begin="0.88s"
        dur="1.30s"
        fill="freeze"/>
      <animateTransform attributeName="transform"
        type="translate"
        from="0 10" to="0 0"
        begin="0.88s"
        dur="1.30s"
        fill="freeze"/>
      <text x="464" y="160" fill="#f3f5ff" font-size="27"
        font-family="Segoe UI,Arial" font-weight="600">322</text>
    </g>
    
    <text x="682" y="125" fill="#8d9ab8" font-size="11"
      font-family="Segoe UI,Arial">FOLLOWERS</text>

    <g opacity="0">
      <animate attributeName="opacity"
        from="0" to="1"
        begin="1.32s"
        dur="1.30s"
        fill="freeze"/>
      <animateTransform attributeName="transform"
        type="translate"
        from="0 10" to="0 0"
        begin="1.32s"
        dur="1.30s"
        fill="freeze"/>
      <text x="682" y="160" fill="#f3f5ff" font-size="27"
        font-family="Segoe UI,Arial" font-weight="600">22</text>
    </g>
    
    <rect x="2" y="2"
      width="896" height="186"
      rx="16"
      fill="none"
      stroke="url(#rgbBorder)"
      stroke-width="6"/>
    </svg>
    