
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="460"
     viewBox="0 0 900 460">

  <defs>
    <linearGradient id="introBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10182d"/>
      <stop offset="100%" stop-color="#17112b"/>
    </linearGradient>

    <linearGradient id="introAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#62a8ff"/>
      <stop offset="55%" stop-color="#9b7bff"/>
      <stop offset="100%" stop-color="#e18bff"/>
    </linearGradient>

    <linearGradient id="introBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="33%" stop-color="#00FF00"/>
      <stop offset="67%" stop-color="#0000FF"/>
      <stop offset="100%" stop-color="#FF0000"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 0.5 0.5"
        to="360 0.5 0.5"
        dur="12s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="460" rx="18"
        fill="url(#introBg)"
        stroke="#34415f" stroke-width="1"/>

  <!-- Ambient light -->
  <circle cx="450" cy="180" r="260"
          fill="#765cff" opacity=".05"/>

  <!-- Animated star dust -->
  <g fill="#CDE7FF">
    <circle cx="75" cy="92" r="1.8">
      <animate attributeName="opacity"
        values=".15;.85;.2" dur="6.5s"
        repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;8 -12;0 0"
        dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="275" r="1.5">
      <animate attributeName="opacity"
        values=".2;.9;.15" dur="7.2s"
        begin="1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;-6 -10;0 0"
        dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="825" cy="90" r="1.7">
      <animate attributeName="opacity"
        values=".15;.8;.2" dur="6.8s"
        begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;-8 12;0 0"
        dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="845" cy="285" r="1.5">
      <animate attributeName="opacity"
        values=".2;.9;.15" dur="7.5s"
        begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;5 -12;0 0"
        dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="75" r="1.3">
      <animate attributeName="opacity"
        values=".1;.7;.1" dur="6s"
        begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="390" r="1.6">
      <animate attributeName="opacity"
        values=".15;.8;.15" dur="8s"
        begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="390" r="1.4">
      <animate attributeName="opacity"
        values=".1;.8;.1" dur="7s"
        begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="390" r="1.5">
      <animate attributeName="opacity"
        values=".1;.8;.1" dur="8.5s"
        begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="420" r="1.2">
      <animate attributeName="opacity"
        values=".1;.65;.1" dur="7.5s"
        begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="65" r="1.3">
      <animate attributeName="opacity"
        values=".1;.7;.1" dur="9s"
        begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="410" r="1.2">
      <animate attributeName="opacity"
        values=".1;.7;.1" dur="8s"
        begin="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="735" cy="410" r="1.3">
      <animate attributeName="opacity"
        values=".1;.7;.1" dur="6.8s"
        begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pulsing halos around username -->
  <g fill="none" stroke="#8D9DFF" stroke-width="1.5">
    <circle cx="450" cy="132" r="48" opacity="0">
      <animate attributeName="r"
        values="48;112" dur="4.8s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".22;0" dur="4.8s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="132" r="48" opacity="0">
      <animate attributeName="r"
        values="48;112" dur="5.4s"
        begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".2;0" dur="5.4s"
        begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="132" r="48" opacity="0">
      <animate attributeName="r"
        values="48;112" dur="6s"
        begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".18;0" dur="6s"
        begin="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Digital data streams: left and right edges -->
  <g fill="none" stroke="#70BFFF" stroke-width="1"
     opacity=".18">
    <g>
      <path d="M42 80 V165 M42 190 V250 M42 290 V350"/>
      <path d="M78 120 V185 M78 220 V280 M78 320 V390"/>
      <path d="M115 65 V130 M115 165 V225 M115 265 V330"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;0 42"
        dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M785 75 V145 M785 180 V245 M785 280 V345"/>
      <path d="M822 110 V175 M822 210 V275 M822 310 V380"/>
      <path d="M858 65 V135 M858 170 V235 M858 270 V335"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 42;0 0"
        dur="8s" begin="1.7s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Data stream highlights -->
  <g fill="#A8DFFF">
    <circle cx="42" cy="100" r="2" opacity=".35">
      <animate attributeName="cy"
        values="100;350;100" dur="7s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".1;.65;.1" dur="7s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="300" r="2" opacity=".3">
      <animate attributeName="cy"
        values="300;80;300" dur="8s"
        begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".1;.6;.1" dur="8s"
        begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="785" cy="120" r="2" opacity=".35">
      <animate attributeName="cy"
        values="120;370;120" dur="7.5s"
        begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".1;.65;.1" dur="7.5s"
        begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="858" cy="330" r="2" opacity=".3">
      <animate attributeName="cy"
        values="330;90;330" dur="8.5s"
        begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values=".1;.6;.1" dur="8.5s"
        begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Section label -->
  <text x="450" y="52"
        text-anchor="middle"
        fill="#91A5CB"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="19"
        font-weight="600"
        letter-spacing="3">
    人员简报 · hkiceflow
  </text>

  <!-- Username -->
  <text x="450" y="132"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="60"
        font-weight="700"
        letter-spacing="2">
    iceflow
  </text>

  <!-- Greeting -->
  <text x="450" y="187"
        text-anchor="middle"
        fill="url(#introAccent)"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="30"
        font-weight="600">
    👋 : HI！ This's ICEFLOW
  </text>

  <!-- Personal statement -->
  <text x="450" y="232"
        text-anchor="middle"
        fill="#C5D1EA"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="23">
    Obviously, I am Chinese. 😎
  </text>

  <!-- Divider -->
  <rect x="320" y="258"
        width="260" height="3"
        rx="1.5"
        fill="url(#introAccent)"/>

  <!-- Professional roles -->
  <text x="450" y="310"
        text-anchor="middle"
        fill="#DCE6FF"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="23">
    VR软硬件开发工程师 · 测试工程师 · 交互设计师
  </text>

  <text x="450" y="348"
        text-anchor="middle"
        fill="#DCE6FF"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="23">
    数据分析师 · 产品经理 · OPC · CEO · 集团顾问
  </text>

  <text x="450" y="386"
        text-anchor="middle"
        fill="#DCE6FF"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="23">
    剪辑师 · 调色师【其余可查看下方列表】
  </text>

  <!-- Developer identity -->
  <text x="450" y="427"
        text-anchor="middle"
        fill="#A9B8D8"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="20">
    MPV（mpv-net）、Stablediffusion（sd项目已弃用）开发者
  </text>

  <!-- RGB animated border -->
  <rect x="2" y="2"
        width="896" height="456"
        rx="16"
        fill="none"
        stroke="url(#introBorder)"
        stroke-width="4"/>

</svg>
