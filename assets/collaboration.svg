  <path d="M72 34 H828" stroke="url(#edge)" stroke-width="2" opacity=".85"/>

  <g font-family="'Noto Sans CJK SC',sans-serif" text-anchor="middle">
    <text x="450" y="132" fill="#91a8d8" font-size="12" letter-spacing="4">LET'S BUILD SOMETHING MEANINGFUL</text>
