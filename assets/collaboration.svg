<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">期待与你共同打造下一个作品</title>
  <desc id="desc">深空主题的合作邀请卡片，表达期待与有深度的团队、有抱负的产品和有实际价值的工程项目合作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182d"/>
      <stop offset="0.52" stop-color="#17132d"/>
      <stop offset="1" stop-color="#10182d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#9a72ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ed78bd" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5edff"/>
      <stop offset=".55" stop-color="#d9d7ff"/>
      <stop offset="1" stop-color="#f4d9f1"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#536dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#536dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c15bdb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c15bdb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
