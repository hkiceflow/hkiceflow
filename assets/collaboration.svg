    <text x="450" y="235" fill="#b8c4df" font-size="18">期待与有深度的团队、有抱负的产品和有实际价值的工程项目合作。</text>
  </g>
  <g fill="none" stroke="url(#edge)" stroke-width="1.5" opacity=".8">
    <path d="M330 275 H410"/><path d="M490 275 H570"/>
