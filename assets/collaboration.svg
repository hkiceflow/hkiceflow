      <stop offset=".5" stop-color="#9d8cff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f08bc9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="218" rx="17" fill="url(#bg)" stroke="#34415f" stroke-width="1.5"/>
  <ellipse cx="185" cy="90" rx="260" ry="145" fill="url(#nebulaA)"/>
  <ellipse cx="735" cy="155" rx="260" ry="150" fill="url(#nebulaB)"/>

  <g fill="#dce7ff">
    <circle cx="62" cy="42" r="1.5" opacity=".8"/><circle cx="112" cy="154" r="1" opacity=".55"/>
    <circle cx="178" cy="34" r="1" opacity=".65"/><circle cx="247" cy="184" r="1.4" opacity=".6"/>
    <circle cx="316" cy="58" r="1" opacity=".55"/><circle cx="388" cy="29" r="1.3" opacity=".65"/>
    <circle cx="478" cy="185" r="1" opacity=".65"/><circle cx="552" cy="42" r="1.2" opacity=".7"/>
    <circle cx="631" cy="178" r="1" opacity=".55"/><circle cx="702" cy="35" r="1.3" opacity=".7"/>
    <circle cx="794" cy="75" r="1" opacity=".6"/><circle cx="842" cy="164" r="1.5" opacity=".65"/>
