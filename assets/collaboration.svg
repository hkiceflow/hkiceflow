      <stop offset=".5" stop-color="#9d8cff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f08bc9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="398" rx="17" fill="url(#bg)" stroke="#34415f" stroke-width="1.5"/>
  <ellipse cx="185" cy="170" rx="300" ry="205" fill="url(#nebulaA)"/>
  <ellipse cx="735" cy="260" rx="300" ry="205" fill="url(#nebulaB)"/>

  <g fill="#dce7ff">
    <circle cx="62" cy="82" r="1.5" opacity=".8"/><circle cx="112" cy="274" r="1" opacity=".55"/>
    <circle cx="178" cy="62" r="1" opacity=".65"/><circle cx="247" cy="324" r="1.4" opacity=".6"/>
    <circle cx="316" cy="108" r="1" opacity=".55"/><circle cx="388" cy="58" r="1.3" opacity=".65"/>
    <circle cx="478" cy="326" r="1" opacity=".65"/><circle cx="552" cy="82" r="1.2" opacity=".7"/>
    <circle cx="631" cy="316" r="1" opacity=".55"/><circle cx="702" cy="70" r="1.3" opacity=".7"/>
    <circle cx="794" cy="135" r="1" opacity=".6"/><circle cx="842" cy="284" r="1.5" opacity=".65"/>
    <circle cx="864" cy="92" r="1" opacity=".5"/><circle cx="38" cy="334" r="1" opacity=".5"/>
  </g>
  <g fill="none" stroke="url(#orbit)" stroke-width="1">
